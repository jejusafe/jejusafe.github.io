<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 안전알림</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#eaf4f3;color:#13201f}
  .box{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px}
  .spin{width:34px;height:34px;border:4px solid #cfe3e1;border-top-color:#0d6b73;border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  p{margin:0;font-size:15px;color:#3b4a48}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><p>제주 안전알림 여는 중…</p></div>
<script>
var APP = "https://script.google.com/macros/s/AKfycbzT2zgDrFZypUbcVXKcAr89ChENgLj-P6aeJSzjDWPqjWyO9woyJVm2I9dKrr85rgB-/exec";
var ua = navigator.userAgent || "";
var inApp = /Instagram|FBAN|FBAV|KAKAOTALK|NAVER|Line\/|Threads/i.test(ua);
var android = /Android/i.test(ua);
var ios = /iPhone|iPad|iPod/i.test(ua);

if (!inApp) {
  location.replace(APP);
} else {
  if (android) {
    // 안드로이드: 크롬(없으면 기본 브라우저)으로 바로 넘김
    location.href = "intent://" + APP.replace(/^https:\/\//, "") +
      "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(APP) + ";end";
  } else if (ios) {
    // 아이폰: 사파리로 넘기기 시도 (앱이 막으면 아무 일도 안 일어남)
    location.href = "x-safari-" + APP;
  }
  // 외부 브라우저로 못 넘어가면 1.2초 뒤 그냥 앱 안에서 사이트 열기
  setTimeout(function(){ if (!document.hidden) location.replace(APP); }, 1200);
}
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbzT2zgDrFZypUbcVXKcAr89ChENgLj-P6aeJSzjDWPqjWyO9woyJVm2I9dKrr85rgB-/exec"></noscript>
</body>
</html>
