<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 안전알림</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#eaf4f3;color:#13201f}
  .box{max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 24px;box-sizing:border-box;text-align:center}
  .spin{width:34px;height:34px;margin:0 auto 16px;border:4px solid #cfe3e1;border-top-color:#0d6b73;border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  p{font-size:16px;margin:0;color:#3b4a48}
  #go{display:none;margin-top:22px;padding:17px;border-radius:14px;background:#0d6b73;color:#fff;font-weight:700;font-size:17px;text-decoration:none}
  #here{display:none;margin-top:14px;color:#0d6b73;font-size:14px}
</style>
</head>
<body>
<div class="box">
  <div class="spin" id="spin"></div>
  <p id="msg">제주 안전알림 여는 중…</p>
  <a id="go" href="#">브라우저로 열기 · Open</a>
  <a id="here" href="#">그냥 여기서 열기</a>
</div>
<script>
var APP = "https://script.google.com/macros/s/AKfycbzT2zgDrFZypUbcVXKcAr89ChENgLj-P6aeJSzjDWPqjWyO9woyJVm2I9dKrr85rgB-/exec";
var H = APP.replace(/^https:\/\//, "");
var ua = navigator.userAgent || "";
var inApp = /Instagram|FBAN|FBAV|KAKAOTALK|NAVER|Line\/|Threads/i.test(ua);
var android = /Android/i.test(ua);

// 안드로이드: ① 삼성 인터넷 → ② 기본 브라우저 / 아이폰: 사파리
var STEPS = android ? [
  "intent://" + H + "#Intent;scheme=https;package=com.sec.android.app.sbrowser;end",
  "intent://" + H + "#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end"
] : [ "x-safari-" + APP ];
var ALL = STEPS.slice();

function left(){ return !document.hidden; }   // 아직 인스타 화면에 남아 있는지

function run(i){
  if (i >= STEPS.length || !left()) return;
  location.href = STEPS[i];
  setTimeout(function(){ if (left()) run(i + 1); }, 700);
}

if (!inApp) {
  location.replace(APP);
} else {
  run(0);                                   // 자동으로 바로 넘김
  setTimeout(function(){                     // 앱이 자동 이동을 막은 경우에만 버튼 표시
    if (!left() || !STEPS.length) return;
    document.getElementById("spin").style.display = "none";
    document.getElementById("msg").textContent = "아래 버튼을 누르면 바로 열려요";
    var g = document.getElementById("go"), h = document.getElementById("here");
    g.href = ALL[0]; g.style.display = "block";
    g.onclick = function(){ STEPS = ALL.slice(); setTimeout(function(){ if (left()) run(1); }, 700); };
    h.href = APP; h.style.display = "block";
  }, 2000);
}
// 다른 브라우저로 넘어갔다가 인스타로 돌아오면 다시 넘기지 않음
document.addEventListener("visibilitychange", function(){ if (document.hidden) STEPS = []; });
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbzT2zgDrFZypUbcVXKcAr89ChENgLj-P6aeJSzjDWPqjWyO9woyJVm2I9dKrr85rgB-/exec"></noscript>
</body>
</html>
